MACHINEOVERRIDES := "beaglebone:"

MACHINE = "roomplayer-plus"

require conf/machine/beaglebone.conf

KERNEL_DEVICETREE:bsp-bb_org-6_6 = "ti/omap/roomplayer-plus.dtb"
KERNEL_DEVICETREE:bsp-bb_org-6_12 = "ti/omap/roomplayer-plus.dtb"

KERNEL_IMAGETYPE = "uImage"

PREFERRED_PROVIDER_virtual/kernel = "linux-ti-staging"

UBOOT_MACHINE = "am335x_evm_defconfig"

UBOOT_LOADADDRESS = "0x80008000"
UBOOT_ENTRYPOINT = "0x80008000"

IMAGE_BOOT_FILES = "uImage-initramfs-${MACHINE};uImage roomplayer-plus.dtb rfspart bootargs"

INITRAMFS_IMAGE_BUNDLE = "1"